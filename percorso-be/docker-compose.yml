services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: percorso-be-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://user:pass@db:5432/lipari
      - REDIS_URL=redis://cache:6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - app-net

  db:
    image: postgres:16.2-alpine
    container_name: percorso-be-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=lipari
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d lipari"]
      interval: 8s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  cache:
    image: redis:7.2-alpine
    container_name: percorso-be-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - app-net

volumes:
  postgres_data:

networks:
  app-net: